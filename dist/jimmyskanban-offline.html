  <style>
:root {
  --bg: #eef2f7;
  --surface: #ffffff;
  --surface-2: #f6f8fb;
  --text: #1e293b;
  --muted: #64748b;
  --border: #d8dee8;
  --primary: #2563eb;
  --primary-text: #ffffff;
  --danger: #dc2626;
  --done: #15803d;
  --important: #dc2626;
  --shadow: 0 1px 2px rgba(15, 23, 42, .08), 0 2px 6px rgba(15, 23, 42, .06);
  --col-w: 340px;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f172a; --surface: #1e293b; --surface-2: #172033; --text: #e2e8f0;
    --muted: #94a3b8; --border: #334155; --primary: #3b82f6;
    --done: #22c55e; --important: #f87171;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f172a; --surface: #1e293b; --surface-2: #172033; --text: #e2e8f0;
  --muted: #94a3b8; --border: #334155; --primary: #3b82f6;
  --done: #22c55e; --important: #f87171;
  --shadow: 0 1px 2px rgba(0,0,0,.4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; display: flex; flex-direction: column;
  background: var(--bg); color: var(--text);
  font: 14px/1.5 "Microsoft JhengHei UI", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
}
button, input, textarea, select { font: inherit; color: inherit; }

/* ---------- top bar ---------- */
.topbar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 220px; }
.brand-logo { width: 28px; height: 28px; border-radius: 6px; }
.board-title {
  margin: 0; font-size: 18px; font-weight: 700; cursor: text;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-radius: 6px; padding: 2px 6px;
}
.board-title:hover, .board-title:focus { background: var(--surface-2); outline: none; }
.board-title[contenteditable="true"] { outline: 2px solid var(--primary); white-space: normal; }
.toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.search {
  width: 200px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2);
}

.btn {
  display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px;
  border: 1px solid var(--border); border-radius: 8px; background: var(--surface); cursor: pointer; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-text); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn.small { padding: 2px 10px; font-size: 13px; }
.btn.icon { padding: 6px 9px; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }

.menu-wrap { position: relative; }
.menu {
  position: absolute; right: 0; top: calc(100% + 4px); z-index: 20; min-width: 230px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); padding: 6px;
}
.menu button {
  display: block; width: 100%; text-align: left; padding: 7px 10px; border: 0; background: none; border-radius: 6px; cursor: pointer;
}
.menu button:hover { background: var(--surface-2); }
.menu hr { border: 0; border-top: 1px solid var(--border); margin: 4px 0; }

.banner {
  display: flex; align-items: center; gap: 10px; padding: 8px 16px;
  background: #fef3c7; color: #78350f; border-bottom: 1px solid #fcd34d;
}
:root[data-theme="dark"] .banner { background: #422006; color: #fde68a; border-color: #854d0e; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .banner { background: #422006; color: #fde68a; border-color: #854d0e; }
}

/* ---------- board ---------- */
.board {
  flex: 1; display: flex; align-items: flex-start; gap: 14px;
  padding: 16px; overflow: auto;
}
.column {
  flex: 0 0 var(--col-w); width: var(--col-w); max-height: 100%;
  display: flex; flex-direction: column;
  background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius);
  border-top: 4px solid var(--col-color, var(--muted));
}
.column.dragging { opacity: .5; }
.column-head { display: flex; align-items: flex-start; gap: 6px; padding: 10px 10px 6px 12px; cursor: grab; }
.column-title { flex: 1; min-width: 0; }
.column-title h2 { margin: 0; font-size: 15px; font-weight: 700; word-break: break-word; }
.column-title .desc { color: var(--muted); font-size: 12px; word-break: break-word; }
.count { font-size: 12px; color: var(--muted); background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 0 8px; white-space: nowrap; }
.count.over { color: #fff; background: var(--danger); border-color: var(--danger); }

.col-scroll { overflow-y: auto; padding: 0 8px 8px; flex: 1; min-height: 60px; }
.area { display: flex; flex-direction: column; gap: 8px; min-height: 44px; padding: 4px; border-radius: 8px; transition: background .12s; }
.area.drop-target { background: rgba(37, 99, 235, .10); outline: 2px dashed var(--primary); outline-offset: -2px; }
.area-label {
  display: flex; align-items: center; gap: 6px; margin: 10px 4px 2px;
  font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .04em;
}
.area-label::after { content: ""; flex: 1; border-top: 1px dashed var(--border); }
.area-label .btn { order: 2; }
.area.done-area { background: rgba(21, 128, 61, .05); }
.area.done-area.drop-target { background: rgba(21, 128, 61, .14); outline-color: var(--done); }
.empty-hint { color: var(--muted); font-size: 12px; text-align: center; padding: 8px; }

.add-card { margin: 0 8px 10px; }
.add-card-btn { width: 100%; justify-content: center; color: var(--muted); border-style: dashed; background: transparent; }
.add-card-form textarea {
  width: 100%; resize: vertical; padding: 8px; border: 1px solid var(--primary); border-radius: 8px; background: var(--surface);
}
.add-card-form .row { display: flex; gap: 6px; margin-top: 6px; }

.add-column {
  flex: 0 0 220px; padding: 14px; border: 2px dashed var(--border); border-radius: var(--radius);
  color: var(--muted); background: transparent; cursor: pointer; text-align: center;
}
.add-column:hover { border-color: var(--primary); color: var(--primary); }

/* ---------- card ---------- */
.card {
  position: relative; background: var(--card-bg, var(--surface)); border: 1px solid var(--border);
  border-left: 4px solid var(--card-accent, transparent);
  border-radius: 8px; padding: 9px 10px 8px; box-shadow: var(--shadow); cursor: grab;
  min-height: 64px;
}
.card:hover { border-color: var(--primary); }
.card.dragging { opacity: .4; }
.card.is-done { opacity: .82; }
.card.is-done .card-title { text-decoration: line-through; text-decoration-color: rgba(100,116,139,.6); }
.card-title {
  margin: 0; font-size: 14px; font-weight: 600; word-break: break-word;
  /* 標題拉寬顯示：最多 3 行，比原版單行截斷多很多字 */
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  padding-right: 4px;
}
.card-desc {
  margin: 4px 0 0; color: var(--muted); font-size: 12.5px; white-space: pre-wrap; word-break: break-word;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.card-meta {
  display: flex; flex-wrap: wrap; gap: 2px 10px; margin-top: 8px; padding-right: 78px;
  font-size: 11px; color: var(--muted);
}
.card-meta span { white-space: nowrap; }
.card-meta .done-at { color: var(--done); font-weight: 600; }
.card mark { background: #fde047; color: inherit; border-radius: 2px; }

/* ---------- stamp (右下角印章) ---------- */
.stamp {
  position: absolute; right: 8px; bottom: 6px;
  min-width: 64px; height: 28px; padding: 0 8px;
  border: 2px dashed transparent; border-radius: 6px; background: transparent;
  font-weight: 900; font-size: 14px; letter-spacing: .06em; cursor: pointer;
  transform: rotate(-8deg); transition: transform .12s;
  color: transparent;
}
.stamp:hover { transform: rotate(-8deg) scale(1.08); }
.stamp.none { border-color: var(--border); opacity: 0; }
.card:hover .stamp.none, .stamp.none:focus-visible { opacity: .9; color: var(--muted); }
.stamp.none::before { content: "印章"; font-size: 11px; font-weight: 600; letter-spacing: 0; }
.stamp.important {
  color: var(--important); border: 3px double var(--important);
  background: rgba(220, 38, 38, .06); font-family: "DFKai-SB", "BiauKai", "KaiTi", serif;
}
.stamp.done {
  color: var(--done); border: 3px double var(--done); border-radius: 50px;
  background: rgba(21, 128, 61, .07); font-family: "DFKai-SB", "BiauKai", "KaiTi", serif;
}
.stamp-chip { display: inline-block; padding: 0 8px; border-radius: 6px; font-weight: 800; transform: rotate(-6deg); }
.stamp-chip.important { color: var(--important); border: 2px double var(--important); }
.stamp-chip.done { color: var(--done); border: 2px double var(--done); border-radius: 20px; }

/* ---------- dialogs ---------- */
.dialog {
  width: min(560px, calc(100vw - 32px)); border: 1px solid var(--border); border-radius: 14px;
  background: var(--surface); color: var(--text); padding: 20px; box-shadow: 0 20px 50px rgba(0,0,0,.25);
}
.dialog.wide { width: min(720px, calc(100vw - 32px)); }
.dialog::backdrop { background: rgba(15, 23, 42, .45); }
.dialog h2 { margin: 0 0 12px; font-size: 18px; }
.dialog label { display: block; margin: 10px 0; font-weight: 600; font-size: 13px; }
.dialog input:not([type=radio]):not([type=range]), .dialog textarea, .dialog select {
  display: block; width: 100%; margin-top: 4px; padding: 8px 10px; font-weight: 400; font-size: 14px;
  border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2);
}
.dialog input[type=range] { width: 100%; }
.dialog textarea { resize: vertical; }
.dialog fieldset { border: 1px solid var(--border); border-radius: 8px; margin: 10px 0; padding: 6px 12px 10px; }
.dialog legend { font-size: 13px; font-weight: 600; padding: 0 4px; }
.stamp-choice label { display: inline-flex; align-items: center; gap: 6px; margin: 6px 16px 0 0; font-weight: 400; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 6px; }
.swatch { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--border); cursor: pointer; padding: 0; }
.swatch[aria-pressed="true"] { outline: 3px solid var(--primary); outline-offset: 2px; }
.swatch.none { background: linear-gradient(135deg, var(--surface) 45%, var(--danger) 47%, var(--danger) 53%, var(--surface) 55%); }
.times { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 12px 0 0; font-size: 12.5px; color: var(--muted); }
.times dt { font-weight: 600; }
.times dd { margin: 0; }
.dialog-actions { display: flex; gap: 8px; margin-top: 18px; align-items: center; }
.spacer { flex: 1; }
.hint { color: var(--muted); font-size: 12.5px; }

.snap-list { display: flex; flex-direction: column; gap: 6px; max-height: 50vh; overflow: auto; }
.snap-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; }
.snap-item .info { flex: 1; }
.snap-item .sub { color: var(--muted); font-size: 12px; }

/* ---------- status / toast ---------- */
.statusbar {
  display: flex; gap: 12px; padding: 4px 16px; font-size: 12px; color: var(--muted);
  background: var(--surface); border-top: 1px solid var(--border);
}
.toast {
  position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); z-index: 100;
  background: #0f172a; color: #fff; padding: 10px 18px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.3);
  max-width: calc(100vw - 32px);
}
.toast.error { background: var(--danger); }

@media (max-width: 640px) {
  .topbar { padding: 8px 12px; }
  .search { width: 100%; }
  .toolbar { width: 100%; }
  .board { padding: 12px; }
  .column { flex-basis: min(var(--col-w), calc(100vw - 40px)); width: min(var(--col-w), calc(100vw - 40px)); }
}

</style>

  <script>
/*
 * JimmysKanban — 資料模型（純邏輯，不碰 DOM / 儲存）
 * 可在瀏覽器（window.JK.model）與 Node（module.exports）中使用，方便單元測試。
 *
 * State 結構：
 * {
 *   schema: 1,
 *   board:   { title, createdAt, updatedAt },
 *   columns: [{ id, title, description, color, wipLimit, createdAt, updatedAt }],
 *   cards:   [{ id, columnId, title, description, color, stamp, order,
 *               createdAt, updatedAt, completedAt }],
 *   settings:{ theme: 'light'|'dark'|'auto', columnWidth: number }
 * }
 * stamp: ''（無）| 'important'（特重要）| 'done'（已完成!）
 */
(function (root) {
  'use strict';

  var SCHEMA = 1;
  var STAMPS = ['', 'important', 'done'];
  var STAMP_LABELS = { '': '', important: '特重要', done: '已完成!' };

  function nowISO(now) {
    return (now ? new Date(now) : new Date()).toISOString();
  }

  function uid() {
    if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
    return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  }

  function emptyState(now) {
    var t = nowISO(now);
    return {
      schema: SCHEMA,
      board: { title: 'Jimmy 的看板', createdAt: t, updatedAt: t },
      columns: [],
      cards: [],
      settings: { theme: 'auto', columnWidth: 340 }
    };
  }

  function sampleState(now) {
    var s = emptyState(now);
    var todo = addColumn(s, { title: '待辦', color: '#3b82f6' }, now);
    var doing = addColumn(s, { title: '進行中', color: '#f59e0b' }, now);
    addColumn(s, { title: '本週回顧', color: '#10b981' }, now);
    addCard(s, todo.id, { title: '歡迎使用 JimmysKanban！點兩下便條紙可編輯', description: '所有資料都存在這台電腦的瀏覽器資料庫（IndexedDB），不會上傳。' }, now);
    var c2 = addCard(s, todo.id, { title: '點右下角印章可切換：特重要 → 已完成! → 無' }, now);
    setStamp(s, c2.id, 'important', now);
    var c3 = addCard(s, doing.id, { title: '記得定期按「備份」匯出 JSON 檔' }, now);
    setStamp(s, c3.id, 'done', now);
    return s;
  }

  /* ---------- 查詢 ---------- */

  function findColumn(s, id) { return s.columns.find(function (c) { return c.id === id; }) || null; }
  function findCard(s, id) { return s.cards.find(function (c) { return c.id === id; }) || null; }

  function isDone(card) { return card.stamp === 'done'; }

  /** 進行中區：依 order 升冪 */
  function activeCards(s, columnId) {
    return s.cards
      .filter(function (c) { return c.columnId === columnId && !isDone(c); })
      .sort(function (a, b) { return a.order - b.order; });
  }

  /** 完成區：依完成時間降冪（最新完成在最上面） */
  function doneCards(s, columnId) {
    return s.cards
      .filter(function (c) { return c.columnId === columnId && isDone(c); })
      .sort(function (a, b) {
        return String(b.completedAt || '').localeCompare(String(a.completedAt || ''));
      });
  }

  /* ---------- 欄位 ---------- */

  function touchBoard(s, t) { s.board.updatedAt = t; }

  function addColumn(s, data, now) {
    var t = nowISO(now);
    var col = {
      id: uid(),
      title: String((data && data.title) || '新欄位').trim() || '新欄位',
      description: (data && data.description) || '',
      color: (data && data.color) || '#64748b',
      wipLimit: Math.max(0, parseInt(data && data.wipLimit, 10) || 0),
      createdAt: t,
      updatedAt: t
    };
    s.columns.push(col);
    touchBoard(s, t);
    return col;
  }

  function updateColumn(s, id, patch, now) {
    var col = findColumn(s, id);
    if (!col) return null;
    var t = nowISO(now);
    ['title', 'description', 'color'].forEach(function (k) {
      if (patch[k] !== undefined) col[k] = patch[k];
    });
    if (patch.wipLimit !== undefined) col.wipLimit = Math.max(0, parseInt(patch.wipLimit, 10) || 0);
    if (!String(col.title).trim()) col.title = '未命名欄位';
    col.updatedAt = t;
    touchBoard(s, t);
    return col;
  }

  function deleteColumn(s, id, now) {
    var before = s.columns.length;
    s.columns = s.columns.filter(function (c) { return c.id !== id; });
    s.cards = s.cards.filter(function (c) { return c.columnId !== id; });
    if (s.columns.length !== before) touchBoard(s, nowISO(now));
    return s.columns.length !== before;
  }

  /** 將欄位移到 toIndex（0 起算） */
  function moveColumn(s, id, toIndex, now) {
    var from = s.columns.findIndex(function (c) { return c.id === id; });
    if (from < 0) return false;
    var col = s.columns.splice(from, 1)[0];
    toIndex = Math.max(0, Math.min(s.columns.length, toIndex));
    s.columns.splice(toIndex, 0, col);
    touchBoard(s, nowISO(now));
    return true;
  }

  /* ---------- 便條紙 ---------- */

  function nextOrder(s, columnId) {
    var list = activeCards(s, columnId);
    return list.length ? list[list.length - 1].order + 1 : 0;
  }

  function addCard(s, columnId, data, now) {
    if (!findColumn(s, columnId)) return null;
    var t = nowISO(now);
    var card = {
      id: uid(),
      columnId: columnId,
      title: String((data && data.title) || '').trim() || '新便條紙',
      description: (data && data.description) || '',
      color: (data && data.color) || '',
      stamp: '',
      order: nextOrder(s, columnId),
      createdAt: t,
      updatedAt: t,
      completedAt: null
    };
    s.cards.push(card);
    if (data && data.stamp) setStamp(s, card.id, data.stamp, now);
    touchBoard(s, t);
    return card;
  }

  /** 修改內容（title/description/color）；有實際變動才更新 updatedAt */
  function updateCard(s, id, patch, now) {
    var card = findCard(s, id);
    if (!card) return null;
    var t = nowISO(now);
    var changed = false;
    ['title', 'description', 'color'].forEach(function (k) {
      if (patch[k] !== undefined && patch[k] !== card[k]) { card[k] = patch[k]; changed = true; }
    });
    if (!String(card.title).trim()) card.title = '新便條紙';
    if (patch.stamp !== undefined && patch.stamp !== card.stamp) {
      setStamp(s, id, patch.stamp, now);
      changed = true;
    }
    if (changed) { card.updatedAt = t; touchBoard(s, t); }
    return card;
  }

  /**
   * 設定印章。
   * - 設為 done：記錄 completedAt，自動移到完成區（依完成時間排序）
   * - 從 done 改成其他：清除 completedAt，回到進行中區最下方
   */
  function setStamp(s, id, stamp, now) {
    var card = findCard(s, id);
    if (!card) return null;
    if (STAMPS.indexOf(stamp) < 0) stamp = '';
    if (card.stamp === stamp) return card;
    var t = nowISO(now);
    var wasDone = isDone(card);
    if (stamp === 'done') {
      card.stamp = 'done';
      card.completedAt = t;
    } else {
      card.stamp = stamp;
      if (wasDone) {
        card.completedAt = null;
        card.order = nextOrder(s, card.columnId);
      }
    }
    card.updatedAt = t;
    touchBoard(s, t);
    return card;
  }

  /** 印章循環：無 → 特重要 → 已完成! → 無 */
  function cycleStamp(s, id, now) {
    var card = findCard(s, id);
    if (!card) return null;
    var i = STAMPS.indexOf(card.stamp);
    var next = STAMPS[(i + 1) % STAMPS.length];
    return setStamp(s, id, next, now);
  }

  function deleteCard(s, id, now) {
    var before = s.cards.length;
    s.cards = s.cards.filter(function (c) { return c.id !== id; });
    if (s.cards.length !== before) touchBoard(s, nowISO(now));
    return s.cards.length !== before;
  }

  /**
   * 移動便條紙。
   * @param area 'active' | 'done' — 目標區塊。拖進完成區 = 標記已完成；拖出完成區 = 取消完成。
   * @param index 在進行中區的插入位置（完成區依時間排序，index 忽略）
   */
  function moveCard(s, id, toColumnId, area, index, now) {
    var card = findCard(s, id);
    var col = findColumn(s, toColumnId);
    if (!card || !col) return null;
    var t = nowISO(now);
    var columnChanged = card.columnId !== toColumnId;
    card.columnId = toColumnId;

    if (area === 'done') {
      if (!isDone(card)) setStamp(s, id, 'done', now);
    } else {
      if (isDone(card)) {
        card.stamp = '';
        card.completedAt = null;
      }
      var list = activeCards(s, toColumnId).filter(function (c) { return c.id !== id; });
      if (index === undefined || index === null || index < 0 || index > list.length) index = list.length;

/*
 * JimmysKanban — 本機資料庫
 * 單純化設計：IndexedDB 只有一個 object store「kv」，
 *   kv['state']      = 整個看板（一份 JSON 文件）
 *   kv['snapshots']  = 自動快照陣列（最多 MAX_SNAPSHOTS 份，用來救援誤刪）
 * IndexedDB 不可用時（例如某些瀏覽器的 file:// 或隱私模式）自動退回 localStorage。
 */
(function (root) {
  'use strict';

  var DB_NAME = 'jimmyskanban';
  var STORE = 'kv';
  var LS_PREFIX = 'jimmyskanban:';
  var MAX_SNAPSHOTS = 20;
  var SNAPSHOT_INTERVAL_MS = 30 * 60 * 1000; // 每 30 分鐘最多一份自動快照

  var dbPromise = null;
  var backend = 'indexeddb';

  function openDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise(function (resolve, reject) {
      if (!root.indexedDB) return reject(new Error('no indexedDB'));
      var req;
      try { req = root.indexedDB.open(DB_NAME, 1); } catch (e) { return reject(e); }
      req.onupgradeneeded = function () { req.result.createObjectStore(STORE); };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
      req.onblocked = function () { reject(new Error('indexedDB blocked')); };
    }).catch(function (e) {
      backend = 'localstorage';
      console.warn('[JimmysKanban] IndexedDB 不可用，改用 localStorage：', e);
      return null;
    });
    return dbPromise;
  }

  function idbGet(db, key) {
    return new Promise(function (resolve, reject) {
      var r = db.transaction(STORE, 'readonly').objectStore(STORE).get(key);
      r.onsuccess = function () { resolve(r.result); };
      r.onerror = function () { reject(r.error); };
    });
  }

  function idbSet(db, key, value) {
    return new Promise(function (resolve, reject) {
      var tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(value, key);
      tx.oncomplete = function () { resolve(); };
      tx.onerror = function () { reject(tx.error); };
    });
  }

  function get(key) {
    return openDB().then(function (db) {
      if (db) return idbGet(db, key);
      var raw = root.localStorage.getItem(LS_PREFIX + key);
      return raw ? JSON.parse(raw) : undefined;
    });
  }

  function set(key, value) {
    return openDB().then(function (db) {
      if (db) return idbSet(db, key, value);
      root.localStorage.setItem(LS_PREFIX + key, JSON.stringify(value));
    });
  }

  function clone(v) { return JSON.parse(JSON.stringify(v)); }

  /* ---------- 公開 API ---------- */

  function loadState() { return get('state'); }

  var saveTimer = null;
  var pending = null;
  /** 防抖存檔（250ms），避免拖拉時狂寫 */
  function saveState(state) {
    pending = clone(state);
    clearTimeout(saveTimer);
    return new Promise(function (resolve) {
      saveTimer = setTimeout(function () {
        var s = pending; pending = null;
        set('state', s).then(function () { return maybeAutoSnapshot(s); }).then(resolve, function (e) {
          console.error('[JimmysKanban] 存檔失敗', e);
          resolve();
        });
      }, 250);
    });
  }

  /** 立即寫入（關閉頁面前） */
  function flush() {
    if (!pending) return Promise.resolve();
    clearTimeout(saveTimer);
    var s = pending; pending = null;
    return set('state', s);
  }

  function listSnapshots() {
    return get('snapshots').then(function (v) { return Array.isArray(v) ? v : []; });
  }

  /** 建立快照；reason: 'auto' | 'manual' | 'before-import' | 'before-clear' */
  function addSnapshot(state, reason) {
    return listSnapshots().then(function (list) {
      list.unshift({
        id: 'snap-' + Date.now(),
        at: new Date().toISOString(),
        reason: reason || 'manual',
        cards: state.cards.length,
        columns: state.columns.length,
        state: clone(state)
      });
      return set('snapshots', list.slice(0, MAX_SNAPSHOTS));
    });
  }

  function maybeAutoSnapshot(state) {
    return listSnapshots().then(function (list) {
      var lastAuto = list.find(function (s) { return s.reason === 'auto'; });
      if (lastAuto && Date.now() - Date.parse(lastAuto.at) < SNAPSHOT_INTERVAL_MS) return;
      return addSnapshot(state, 'auto');
    });
  }

  function deleteSnapshot(id) {
    return listSnapshots().then(function (list) {
      return set('snapshots', list.filter(function (s) { return s.id !== id; }));
    });
  }

  /** 要求瀏覽器「持久保存」，降低磁碟空間不足時被清除的機率 */
  function requestPersistence() {
    if (root.navigator && navigator.storage && navigator.storage.persist) {
      return navigator.storage.persisted().then(function (p) { return p || navigator.storage.persist(); })
        .catch(function () { return false; });
    }
    return Promise.resolve(false);
  }

  function estimate() {
    if (root.navigator && navigator.storage && navigator.storage.estimate) return navigator.storage.estimate();
    return Promise.resolve(null);
  }

  root.JK = root.JK || {};
  root.JK.storage = {
    loadState: loadState, saveState: saveState, flush: flush,
    listSnapshots: listSnapshots, addSnapshot: addSnapshot, deleteSnapshot: deleteSnapshot,
    requestPersistence: requestPersistence, estimate: estimate,
    backend: function () { return backend; },
    ready: openDB
  };
})(window);

/*
 * JimmysKanban — 匯出 / 匯入（備份）

(function (root) {

  function stamp() {
    var d = new Date();
    function p(n) { return String(n).padStart(2, '0'); }
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
  }

  /** 下載檔案；Chrome/Edge 支援時改用「另存新檔」對話框，可直接選資料夾 */
  function saveFile(content, filename, mime, ext) {
    var blob = content instanceof Blob ? content : new Blob([content], { type: mime });
    if (root.showSaveFilePicker && root.isSecureContext && root.self === root.top) {
      var types = [{ description: filename, accept: {} }];
      types[0].accept[mime] = [ext];
      return root.showSaveFilePicker({ suggestedName: filename, types: types })
        .then(function (h) { return h.createWritable(); })
        .then(function (w) { return w.write(blob).then(function () { return w.close(); }); })
        .then(function () { return true; })
        .catch(function (e) {
          if (e && e.name === 'AbortError') return false; // 使用者取消
          return downloadBlob(blob, filename);
        });
    }
    return Promise.resolve(downloadBlob(blob, filename));
  }

  function downloadBlob(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);

    var doneArea = h('div', { class: 'area done-area', 'data-area': 'done', 'data-col': col.id });
    done.filter(matches).forEach(function (c) { doneArea.appendChild(renderCard(c)); });
    if (!done.length) doneArea.appendChild(h('div', { class: 'empty-hint', text: '標記「已完成!」或拖到這裡' }));

    var el = h('section', { class: 'column', 'data-id': col.id, style: { '--col-color': col.color } }, [
      h('div', { class: 'column-head', draggable: 'true', title: '拖曳可調整欄位順序' }, [
        h('div', { class: 'column-title' }, [
          h('h2', { text: col.title }),
          col.description ? h('div', { class: 'desc', text: col.description }) : null
        ]),
        h('span', {
          class: 'count' + (over ? ' over' : ''),
          title: col.wipLimit ? '進行中 / 上限' : '進行中數量',
          text: active.length + (col.wipLimit ? ' / ' + col.wipLimit : '')
        }),
        h('button', { class: 'btn ghost small', type: 'button', title: '編輯欄位', 'aria-label': '編輯欄位', onclick: function () { openColumnDialog(col.id); } }, ['⋯'])
      ]),
      h('div', { class: 'col-scroll' }, [
        h('div', { class: 'area-label' }, ['▶ 進行中 ' + active.length]),
        activeArea,
        renderAddCard(col),
        h('div', { class: 'area-label' }, [
          '✔ 已完成 ' + done.length,
          done.length ? h('button', {
            class: 'btn ghost small', type: 'button', title: '刪除此欄所有已完成便條紙',
            onclick: function () {
              confirmBox('清除已完成', '確定刪除「' + col.title + '」的 ' + done.length + ' 張已完成便條紙？（可用 Ctrl+Z 復原）', '刪除').then(function (ok) {
                if (ok) commit(function (s) { M.clearDone(s, col.id); });
              });
            }
          }, ['清除']) : null
        ]),
        doneArea
      ])
    ]);
    bindColumnDrag(el, col);
    return el;
  }

  function renderAddCard(col) {
    var wrap = h('div', { class: 'add-card' });
    function showButton() {
      wrap.textContent = '';
      wrap.appendChild(h('button', { class: 'btn add-card-btn', type: 'button', onclick: showForm }, ['＋ 新增便條紙']));
    }
    function showForm() {
      wrap.textContent = '';
      var ta = h('textarea', { rows: '2', placeholder: '輸入標題，Enter 新增（Shift+Enter 換行，Esc 取消）' });
      function submit() {
        var title = ta.value.trim();
        if (!title) return showButton();
        commit(function (s) { M.addCard(s, col.id, { title: title }); });
        // render() 會重建 DOM，重新打開輸入框方便連續新增
        var again = document.querySelector('.column[data-id="' + col.id + '"] .add-card-btn');
        if (again) again.click();
      }
      ta.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); }
        else if (e.key === 'Escape') showButton();
      });
      wrap.appendChild(h('div', { class: 'add-card-form' }, [
        ta,
        h('div', { class: 'row' }, [
          h('button', { class: 'btn primary small', type: 'button', onclick: submit }, ['新增']),
          h('button', { class: 'btn small', type: 'button', onclick: showButton }, ['取消'])
        ])
      ]));
      ta.focus();
    }
    showButton();
    return wrap;
  }

  function renderCard(card) {
    var stampClass = card.stamp || 'none';
    var stampText = M.STAMP_LABELS[card.stamp] || '';
    var stampTitle = { none: '設定印章（無 → 特重要 → 已完成!）', important: '特重要（點擊改為已完成!）', done: '已完成!（點擊取消）' }[stampClass];

    var el = h('article', {
      class: 'card' + (card.stamp === 'done' ? ' is-done' : ''),
      draggable: 'true', tabindex: '0', 'data-id': card.id,
      title: card.title,
      style: card.color ? { '--card-bg': mix(card.color), '--card-accent': card.color } : null,
      ondblclick: function () { openCardDialog(card.id); },
      onkeydown: function (e) { if (e.key === 'Enter' && e.target === el) openCardDialog(card.id); }
    }, [
      h('h3', { class: 'card-title', text: card.title }),
      card.description ? h('p', { class: 'card-desc', text: card.description }) : null,
      h('div', { class: 'card-meta' }, [
        h('span', { title: '建立時間：' + fmtFull(card.createdAt), text: '建 ' + fmt(card.createdAt) }),
        card.updatedAt !== card.createdAt ? h('span', { title: '最後修改：' + fmtFull(card.updatedAt), text: '改 ' + fmt(card.updatedAt) }) : null,
        card.completedAt ? h('span', { class: 'done-at', title: '完成時間：' + fmtFull(card.completedAt), text: '完 ' + fmt(card.completedAt) }) : null
      ]),
      h('button', {
        class: 'stamp ' + stampClass, type: 'button', title: stampTitle, 'aria-label': stampTitle,
        text: stampText,
        onclick: function (e) {
          e.stopPropagation();
          var c = commit(function (s) { return M.cycleStamp(s, card.id); });
          if (c && c.stamp === 'done') toast('已完成！已移到下方完成區');
        },
        ondblclick: function (e) { e.stopPropagation(); }
      })
    ]);
    el.addEventListener('click', function (e) {
      if (e.detail === 1 && e.target.closest('.card-title')) openCardDialog(card.id);
    });
    bindCardDrag(el, card);
    return el;
  }

  /** 便條紙底色：把顏色和白色混一點，讓深色主題也看得清楚 */
  function mix(hex) {
    var dark = document.documentElement.getAttribute('data-theme') === 'dark' ||
      (document.documentElement.getAttribute('data-theme') !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    return dark ? 'color-mix(in srgb, ' + hex + ' 18%, #1e293b)' : 'color-mix(in srgb, ' + hex + ' 55%, #ffffff)';
  }

  function updateStatus() {
    var total = state.cards.length;
    var doneN = state.cards.filter(M.isDone).length;
    var imp = state.cards.filter(function (c) { return c.stamp === 'important'; }).length;
    $('statusText').textContent = state.columns.length + ' 個欄位 · ' + total + ' 張便條紙（進行中 ' + (total - doneN) +
      '、特重要 ' + imp + '、已完成 ' + doneN + '）· 儲存於 ' + (DB.backend() === 'indexeddb' ? '本機 IndexedDB' : '本機 localStorage');
    var last = lsGet('lastBackupAt', null);
    $('lastBackupText').textContent = last ? '上次備份：' + fmtFull(last) : '尚未備份';
  }

  /* ---------- 拖曳 ---------- */

  var dragCardId = null;
  var dragColumnId = null;

  function bindCardDrag(el, card) {
    el.addEventListener('dragstart', function (e) {
      if (e.target !== el) return;
      dragCardId = card.id;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', card.title);
      requestAnimationFrame(function () { el.classList.add('dragging'); });
      e.stopPropagation();
    });
    el.addEventListener('dragend', function () {
      dragCardId = null;
      el.classList.remove('dragging');
      clearDropTargets();
    });
  }

  function clearDropTargets() {
    document.querySelectorAll('.drop-target').forEach(function (x) { x.classList.remove('drop-target'); });
  }

  /** 依滑鼠 Y 位置算出插入 index（以完整資料、非搜尋過濾後的列表為準） */
  function dropIndex(area, y) {
    var cards = Array.prototype.slice.call(area.querySelectorAll('.card:not(.dragging)'));
    for (var i = 0; i < cards.length; i++) {
      var r = cards[i].getBoundingClientRect();
      if (y < r.top + r.height / 2) {
        var list = M.activeCards(state, area.dataset.col).filter(function (c) { return c.id !== dragCardId; });
        var idx = list.findIndex(function (c) { return c.id === cards[i].dataset.id; });
        return idx < 0 ? list.length : idx;
      }
    }
    return null; // 放到最後
  }

  function bindBoardDnD() {
    var board = $('board');
    board.addEventListener('dragover', function (e) {
      if (dragCardId) {
        var area = e.target.closest('.area');
        if (!area) {
          var col = e.target.closest('.column');
          if (!col) return;
          area = col.querySelector('.active-area');
        }
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        if (!area.classList.contains('drop-target')) { clearDropTargets(); area.classList.add('drop-target'); }
      } else if (dragColumnId) {
        e.preventDefault();
      }
    });
    board.addEventListener('drop', function (e) {
      if (dragCardId) {
        e.preventDefault();
        var area = e.target.closest('.area');
        if (!area) {
          var colEl = e.target.closest('.column');
          if (!colEl) return;
          area = colEl.querySelector('.active-area');
        }
        var id = dragCardId;
        var target = area.dataset.area;
        var idx = target === 'active' ? dropIndex(area, e.clientY) : null;
        var card = M.findCard(state, id);
        var wasDone = card && M.isDone(card);
        commit(function (s) { M.moveCard(s, id, area.dataset.col, target, idx); });
        if (target === 'done' && !wasDone) toast('已標記為「已完成!」');
        else if (target === 'active' && wasDone) toast('已取消完成，移回進行中');
        clearDropTargets();
      } else if (dragColumnId) {
        e.preventDefault();
        var cols = Array.prototype.slice.call(board.querySelectorAll('.column'));
        var to = cols.length;
        for (var i = 0; i < cols.length; i++) {
          var r = cols[i].getBoundingClientRect();
          if (e.clientX < r.left + r.width / 2) { to = i; break; }
        }
        var from = state.columns.findIndex(function (c) { return c.id === dragColumnId; });
        if (from < to) to--;
        var cid = dragColumnId;
        commit(function (s) { M.moveColumn(s, cid, to); });
      }
    });
    board.addEventListener('dragleave', function (e) {
      if (!board.contains(e.relatedTarget)) clearDropTargets();
    });
  }

  function bindColumnDrag(el, col) {
    var head = el.querySelector('.column-head');
    head.addEventListener('dragstart', function (e) {
      dragColumnId = col.id;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', col.title);
      e.dataTransfer.setDragImage(el, 20, 20);
      requestAnimationFrame(function () { el.classList.add('dragging'); });
    });
    head.addEventListener('dragend', function () { dragColumnId = null; el.classList.remove('dragging'); });
  }

  /* ---------- 對話框：便條紙 ---------- */

  var editingCardId = null;

  function renderSwatches(container, colors, current, onPick) {
    container.textContent = '';
    colors.forEach(function (c) {
      container.appendChild(h('button', {
        type: 'button', class: 'swatch' + (c ? '' : ' none'), 'aria-pressed': String(c === current),
        title: c || '無', 'aria-label': c || '無顏色', style: c ? { background: c } : null,
        onclick: function () {
          container.querySelectorAll('.swatch').forEach(function (s) { s.setAttribute('aria-pressed', 'false'); });
          this.setAttribute('aria-pressed', 'true');
          onPick(c);
        }
      }));
    });
  }

  var pickedCardColor = '';
  function openCardDialog(id) {
    var card = M.findCard(state, id);
    if (!card) return;
    editingCardId = id;
    var f = $('cardForm');
    f.title.value = card.title;
    f.description.value = card.description;
    f.querySelector('input[name=stamp][value="' + card.stamp + '"]').checked = true;
    pickedCardColor = card.color;
    renderSwatches($('cardColors'), CARD_COLORS, card.color, function (c) { pickedCardColor = c; });
    var col = M.findColumn(state, card.columnId);
    $('cardDialogTitle').textContent = '編輯便條紙 · ' + (col ? col.title : '');
    var dl = $('cardTimes');
    dl.textContent = '';
    [['建立時間', card.createdAt], ['最後修改', card.updatedAt], ['完成時間', card.completedAt]].forEach(function (p) {
      dl.appendChild(h('dt', { text: p[0] }));
      dl.appendChild(h('dd', { text: fmtFull(p[1]) }));
    });
    $('cardDialog').returnValue = '';
    $('cardDialog').showModal();
    f.title.focus();
  }

  function bindCardDialog() {
    var d = $('cardDialog');
    d.addEventListener('close', function () {
      if (d.returnValue !== 'ok' || !editingCardId) return;
      var f = $('cardForm');
      var id = editingCardId;
      var stamp = f.querySelector('input[name=stamp]:checked').value;
      commit(function (s) {
        M.updateCard(s, id, { title: f.title.value.trim(), description: f.description.value, color: pickedCardColor, stamp: stamp });
      });
      editingCardId = null;
    });
    $('btnDeleteCard').addEventListener('click', function () {
      var id = editingCardId;
      d.close('cancel');
      commit(function (s) { M.deleteCard(s, id); });
      toast('已刪除（Ctrl+Z 可復原）');
    });
    // Ctrl+Enter 儲存
    d.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); d.close('ok'); }
    });
  }

  /* ---------- 對話框：欄位 ---------- */

  var editingColumnId = null;
  var pickedColumnColor = COLUMN_COLORS[1];

  function openColumnDialog(id) {
    editingColumnId = id;
    var col = id ? M.findColumn(state, id) : null;
    var f = $('columnForm');
    f.title.value = col ? col.title : '';
    f.description.value = col ? col.description : '';
    f.wipLimit.value = col ? col.wipLimit : 0;
    pickedColumnColor = col ? col.color : COLUMN_COLORS[(state.columns.length + 1) % COLUMN_COLORS.length];
    renderSwatches($('columnColors'), COLUMN_COLORS, pickedColumnColor, function (c) { pickedColumnColor = c; });
    $('columnDialogTitle').textContent = col ? '編輯欄位' : '新增欄位';
    $('btnDeleteColumn').hidden = !col;
    $('columnDialog').returnValue = '';
    $('columnDialog').showModal();
    f.title.focus();
  }

  function bindColumnDialog() {
    var d = $('columnDialog');
    d.addEventListener('close', function () {
      if (d.returnValue !== 'ok') return;
      var f = $('columnForm');
      var data = { title: f.title.value.trim(), description: f.description.value.trim(), wipLimit: f.wipLimit.value, color: pickedColumnColor };
      var id = editingColumnId;
      commit(function (s) { if (id) M.updateColumn(s, id, data); else M.addColumn(s, data); });
      if (!id) setTimeout(function () { var b = $('board'); b.scrollLeft = b.scrollWidth; }, 0);
    });
    $('btnDeleteColumn').addEventListener('click', function () {
      var id = editingColumnId;
      var col = M.findColumn(state, id);
      var n = state.cards.filter(function (c) { return c.columnId === id; }).length;
      d.close('cancel');
      confirmBox('刪除欄位', '確定刪除「' + col.title + '」與其中 ' + n + ' 張便條紙？（Ctrl+Z 可復原）', '刪除').then(function (ok) {
        if (ok) commit(function (s) { M.deleteColumn(s, id); });
      });
    });
  }

  /* ---------- 備份 / 匯出入 ---------- */

  function markBackedUp() {
    lsSet('lastBackupAt', new Date().toISOString());
    $('backupReminder').hidden = true;
    updateStatus();
  }

  function doImport(mode) {
    IO.pickJSON().then(function (data) {
      if (!data) return;
      var next;
      try {
        next = mode === 'merge' ? M.merge(state, data) : M.normalize(data);
      } catch (e) { return toast('匯入失敗：' + e.message, true); }
      var msg = mode === 'merge'
        ? '將合併 ' + next.columns.length + ' 個欄位 / ' + next.cards.length + ' 張便條紙（相同項目以較新的修改時間為準）。'
        : '將以檔案內容（' + next.columns.length + ' 個欄位 / ' + next.cards.length + ' 張便條紙）取代目前看板。';
      return confirmBox(mode === 'merge' ? '匯入（合併）' : '匯入（取代）', msg + '\n匯入前會自動建立快照。', '匯入').then(function (ok) {
        if (!ok) return;
        return DB.addSnapshot(state, 'before-import').then(function () {
          replaceState(next, true);
          toast('匯入完成');
        });
      });
    }).catch(function (e) { toast('匯入失敗：' + e.message, true); });
  }

  var REASONS = { auto: '自動', manual: '手動', 'before-import': '匯入前', 'before-clear': '清空前', 'before-restore': '還原前' };

  function openSnapshots() {
    var list = $('snapList');
    list.textContent = '讀取中…';
    DB.listSnapshots().then(function (snaps) {
      list.textContent = '';
      if (!snaps.length) list.appendChild(h('p', { class: 'hint', text: '目前沒有快照。' }));
      snaps.forEach(function (sn) {
        list.appendChild(h('div', { class: 'snap-item' }, [
          h('div', { class: 'info' }, [
            h('div', { text: fmtFull(sn.at) + '（' + (REASONS[sn.reason] || sn.reason) + '）' }),
            h('div', { class: 'sub', text: sn.columns + ' 個欄位 · ' + sn.cards + ' 張便條紙' })
          ]),
          h('button', {
            class: 'btn small', type: 'button', text: '匯出',
            onclick: function () { IO.exportJSON(sn.state); }
          }),
          h('button', {
            class: 'btn small primary', type: 'button', text: '還原',
            onclick: function () {
              $('snapDialog').close();
              confirmBox('還原快照', '以 ' + fmtFull(sn.at) + ' 的快照取代目前看板？（還原前會先保存目前狀態）', '還原').then(function (ok) {
                if (!ok) return;
                DB.addSnapshot(state, 'before-restore').then(function () {
                  replaceState(M.normalize(sn.state), true);
                  toast('已還原');
                });
              });
            }
          })
        ]));
      });
    });
    $('snapDialog').showModal();
  }

  function handleAction(act) {
    switch (act) {
      case 'export-json':
        IO.exportJSON(state).then(function (ok) { if (ok) { markBackedUp(); toast('備份完成'); } });
        break;
      case 'export-csv': IO.exportCSV(state); break;
      case 'export-md': IO.exportMarkdown(state); break;
      case 'import-replace': doImport('replace'); break;
      case 'import-merge': doImport('merge'); break;
      case 'snapshots': openSnapshots(); break;
      case 'clear':
        confirmBox('清空看板', '確定刪除所有欄位與便條紙？清空前會自動建立快照。', '清空').then(function (ok) {
          if (!ok) return;
          DB.addSnapshot(state, 'before-clear').then(function () {
            commit(function (s) { s.columns = []; s.cards = []; });
            toast('已清空（可從快照還原）');
          });
        });
        break;
    }
  }

  function bindMenu() {
    var btn = $('btnBackup');
    var menu = $('backupMenu');
    function close() { menu.hidden = true; btn.setAttribute('aria-expanded', 'false'); }
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      menu.hidden = !menu.hidden;
      btn.setAttribute('aria-expanded', String(!menu.hidden));
    });
    document.addEventListener('click', function (e) { if (!menu.contains(e.target)) close(); });
    document.addEventListener('click', function (e) {
      var b = e.target.closest('[data-act]');
      if (!b) return;
      close();
      handleAction(b.dataset.act);
    });
  }

  function checkBackupReminder() {
    var days = lsGet('backupReminderDays', 3);
    if (!days || !state.cards.length) return;
    var last = lsGet('lastBackupAt', null);
    var snoozed = lsGet('reminderSnoozedAt', null);
    var ref = Math.max(last ? Date.parse(last) : 0, snoozed ? Date.parse(snoozed) : 0) || Date.parse(state.board.createdAt);
    if (Date.now() - ref > days * 86400000) {
      $('backupReminderText').textContent = last
        ? '距離上次備份已超過 ' + days + ' 天，建議匯出一份備份檔到網路磁碟或雲端資料夾。'
        : '你還沒有備份過！資料只存在這台電腦的瀏覽器裡，建議匯出備份檔。';
      $('backupReminder').hidden = false;
    }
  }

  /* ---------- 設定 / 標題 / 安裝 ---------- */

  function bindSettings() {
    var d = $('settingsDialog');
    var f = $('settingsForm');
    $('btnSettings').addEventListener('click', function () {
      f.theme.value = state.settings.theme;
      f.columnWidth.value = state.settings.columnWidth;
      $('widthOut').textContent = state.settings.columnWidth;
      f.backupReminderDays.value = String(lsGet('backupReminderDays', 3));
      var info = $('storageInfo');
      info.textContent = '儲存方式：' + (DB.backend() === 'indexeddb' ? 'IndexedDB（瀏覽器內建資料庫）' : 'localStorage');
      DB.estimate().then(function (est) {
        if (est && est.usage !== undefined) info.textContent += ' · 已使用約 ' + (est.usage / 1024).toFixed(0) + ' KB';
      });
      if (navigator.storage && navigator.storage.persisted) navigator.storage.persisted().then(function (p) {
        info.textContent += p ? ' · 已啟用持久保存' : ' · 未啟用持久保存（安裝成 App 後較不會被清除）';
      });
      d.showModal();
    });
    f.theme.addEventListener('change', function () { commit(function (s) { s.settings.theme = f.theme.value; }); applySettings(); render(); });
    f.columnWidth.addEventListener('input', function () {
      $('widthOut').textContent = f.columnWidth.value;
      document.documentElement.style.setProperty('--col-w', f.columnWidth.value + 'px');
    });
    f.columnWidth.addEventListener('change', function () {
      var w = parseInt(f.columnWidth.value, 10);
      state.settings.columnWidth = w; DB.saveState(state);
    });
    f.backupReminderDays.addEventListener('change', function () { lsSet('backupReminderDays', parseInt(f.backupReminderDays.value, 10)); });
  }

  function bindTitle() {
    var t = $('boardTitle');
    function start() {
      if (t.isContentEditable) return;
      t.contentEditable = 'true';
      t.focus();
      document.getSelection().selectAllChildren(t);
    }
    function finish(save) {
      if (!t.isContentEditable) return;
      t.contentEditable = 'false';
      var v = t.textContent.trim();
      if (save && v && v !== state.board.title) commit(function (s) { s.board.title = v.slice(0, 80); });
      applySettings();
    }
    t.addEventListener('click', start);
    t.addEventListener('keydown', function (e) {
      if (!t.isContentEditable) { if (e.key === 'Enter') { e.preventDefault(); start(); } return; }
      if (e.key === 'Enter') { e.preventDefault(); finish(true); }
      if (e.key === 'Escape') finish(false);
    });
    t.addEventListener('blur', function () { finish(true); });
  }

  function bindInstall() {
    var deferred = null;
    var btn = $('btnInstall');
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      deferred = e;
      btn.hidden = false;
    });
    btn.addEventListener('click', function () {
      if (!deferred) return;
      deferred.prompt();
      deferred.userChoice.then(function () { deferred = null; btn.hidden = true; });
    });
    window.addEventListener('appinstalled', function () {
      btn.hidden = true;
      toast('安裝完成！之後可從開始功能表或桌面開啟，離線也能用。');
      DB.requestPersistence();
    });
  }

  function bindKeys() {
    document.addEventListener('keydown', function (e) {
      var tag = (e.target.tagName || '').toLowerCase();
      var typing = tag === 'input' || tag === 'textarea' || e.target.isContentEditable;
      if (document.querySelector('dialog[open]')) return;
      if ((e.ctrlKey || e.metaKey) && !typing) {
        if (e.key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
        else if (e.key === 'y' || (e.key === 'z' && e.shiftKey) || e.key === 'Z') { e.preventDefault(); redo(); }
        else if (e.key === 's') { e.preventDefault(); handleAction('export-json'); }
      }
      if (e.key === '/' && !typing) { e.preventDefault(); $('search').focus(); }
    });
  }

  /* ---------- 啟動 ---------- */

  function init() {
    DB.loadState().then(function (saved) {
      try { state = saved ? M.normalize(saved) : M.sampleState(); }
      catch (e) { console.error(e); state = M.sampleState(); }
      if (!saved) DB.saveState(state);
      applySettings();
      render();
      bindBoardDnD();
      bindCardDialog();
      bindColumnDialog();
      bindMenu();
      bindSettings();
      bindTitle();
      bindInstall();
      bindKeys();
      $('btnAddColumn').addEventListener('click', function () { openColumnDialog(null); });
      $('search').addEventListener('input', function (e) { query = e.target.value.trim(); render(); });
      $('btnDismissReminder').addEventListener('click', function () {
        lsSet('reminderSnoozedAt', new Date().toISOString());
        $('backupReminder').hidden = true;
      });
      window.addEventListener('pagehide', function () { DB.flush(); });
      document.addEventListener('visibilitychange', function () { if (document.hidden) DB.flush(); });
      DB.requestPersistence();
      checkBackupReminder();
    });
  }

  init();
})();

</script>
</body>
</html>
